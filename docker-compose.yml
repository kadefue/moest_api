version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: moest_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@db/moest_db
      - DATA_PATH=/app/data/csvs/
    volumes:
      - ./data:/app/data
    depends_on:
      - db
