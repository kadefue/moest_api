version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: moest_db
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@db/moest_db
      - BASE_DIRECTORY=/app/data/csvs/
    volumes:
      - ./data:/app/data # Place your CSVs in a local 'data' folder
    depends_on:
      - db
